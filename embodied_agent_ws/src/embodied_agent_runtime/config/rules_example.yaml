# Agent Runtime 的**规则表**示例 —— Phase 7 那张 Rule Engine 的占位。
#
# ⚠️ **这不是默认配置。** 默认 `rules_file` 是空的，于是任何自然语言任务都会被
#    **明确拒绝**（「需要 LLM 规划，当前未实现（Phase 7）」）。那是刻意的。
#
# 用法：
#     ros2 launch embodied_agent_runtime agent_runtime.launch.py \
#         rules_file:=<这份文件的绝对路径> allow_motion:=true
#
# 它存在的意义：让"查表 → 网关 → task-tier 技能 → 事件 → 唤醒 Agent"这条**链路**
# 今天就能被端到端跑通与验证，不必先有一个 LLM。接 LLM 时替换的是**表的内容**，
# 不是这条链路。
#
# 🔒 **表里只能写 task-tier 技能**（Autonomous / Semantic）。
#    写了 `control.*` 会被 planner **拒绝并说明原因** —— 那是 D-003 的架构红线，
#    在代码里校验，不是靠自觉。理由：这张表将来是 LLM 填的，
#    没有校验的话，一条"顺手"的规则就能让 Agent 绕过准入，而且**没有任何地方会报错**。
#
# ⚠️ 键是**归一化后**的文本（去空白与标点、转小写），所以要写「向前走一小段」
#    而不是「向前走一小段！」

rules:

  # 端到端验收用的那条（`tools/upper_layer_dryrun_acceptance.py` 的【12】用它）。
  # ⚠️ `clear_range` 必须按部署环境实测标定（D-028）：同一台车两次摆位，
  #    近场回波占比在 3.6% 与 67% 之间摆动 —— 拍一个数会被场地否决。
  向前走一小段:
    skill: autonomous.advance_until_blocked
    args:
      max_distance: 0.2      # m，策略上限 0.5
      clear_range: 0.25      # m，**必须实测标定**
      step: 0.1              # m，必须 ≤ max_distance

  # ---- 多步计划（D-043，2026-10-08）----------------------------------------
  # 一个计划是一串**按顺序执行**的步骤。**每一步各自经网关**，
  # 六项检查一遍不少；而且**任何一步不合法 ⇒ 整条计划被拒**（不做半条）。
  # 下面的例子就是最小的"脱困"：前进 → 被挡住就转身 → 再前进。
  往前走被挡就绕开:
    steps:
      - {skill: autonomous.advance_until_blocked,
         args: {max_distance: 0.3, clear_range: 0.5, step: 0.1}}
      - {skill: autonomous.turn_until_clear,
         args: {max_angle: 1.57, clear_range: 0.5, step_angle: 0.3, direction: 1.0}}
      - {skill: autonomous.advance_until_blocked,
         args: {max_distance: 0.3, clear_range: 0.5, step: 0.1}}
  # ⚠️ 推进规则：某步报 FAILED / CANCELLED ⇒ **整条中止**；
  #    其余终态（ARRIVED / BLOCKED / TARGET_FOUND / TARGET_LOST）⇒ **继续下一步**。
  #    `BLOCKED` 必须继续 —— 脱困计划成立的前提就是它。
  # ⚠️ `skill:` 与 `steps:` **不许同时写**（那样"走几步"不明确，会被拒）。
