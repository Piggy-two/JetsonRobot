safety_runtime:
  ros__parameters:
    # 厂商离线 ASR 的文本输出。⚠️ 只**订阅**它 ——
    # 识别侧复用厂商的离线链路，执行侧完全由本项目自己做（D-024 决策 3）。
    voice_topic: /asr_node/voice_words

    # ⚠️ 独立零速通道：锁存期间本节点**自己**直接向底盘发 Twist()（全零）。
    #    为什么不用"命令 Motor Driver 停"就够了：持续发零目前只在 Motor Driver 里（D-025），
    #    **它自己挂了就没人发零了**，而底盘没有指令超时保护（D-020）会一直保持最后速度。
    #    所以急停通道必须独立。🔒 本节点唯一的发布语句是 publish(Twist()) —— 只会发零。
    zero_channel_topic: /cmd_vel
    zero_rate: 10.0

    # 安全词表（整句匹配，不是子串匹配 —— 理由见 estop.py）。
    # 默认表见 embodied_safety_runtime/estop.py 的 DEFAULT_SAFETY_PHRASES。
    # 想加现场常用说法就在这里加，例如：
    #   safety_phrases: ['停', '停下', '急停', 'stop', 'halt']

    # best-effort：把下游的锁存也打开。⚠️ **急停不依赖它们能调通**。
    motor_stop_service: /motor_driver/stop
    control_stop_service: /control_skills/stop

    # 对 Motor Driver 的**停更看门狗**：它自己挂了既不报错也没人转告，
    # 而"持续发零"目前只在它里面（D-025）—— 底盘没有指令超时保护（D-020），
    # 没人发零它会保持最后速度一直跑。所以本节点必须自己盯着，停更即自动接管发零。
    # ⚠️ 首次见到之前永不判失联（否则每次启动都先来一次假警报，把真警报淹掉）。
    watch_motor: true
    motor_status_topic: /embodied/motor/status
    motor_watchdog: 2.0          # 秒。Motor Driver 状态正常约 20 Hz，2 s 已是 40 倍余量

    # ---- 避障守卫（D-036）----
    # 只回答一个问题："按**被命令的运动方向**，阈值之内有没有东西？"
    # 方向与速度取自上面那条 motor_status_topic 里的 vx/vy（Motor Driver 的**输出**，
    # 它锁存/超时时自己就是 0），所以侧移/后退各按各自方向判，不是"哪里是前方"。
    enable_obstacle_guard: true

    # ⚠️ 阈值不用固定距离，用 **速度 × obstacle_lookahead**（TTC 式）。
    #    理由：D-028 实测近场回波占比在两次摆位间 3.6% → 67%，
    #    **任何固定的距离阈值都会被场地否决**；而"这车需要多远刹住"是车的属性。
    obstacle_lookahead: 1.5      # 秒。⚠️ 待实测标定（标定方法见 DEV_NOTES）
    obstacle_min_range: 0.20     # 米。低速兜底。⚠️ 待实测标定
    obstacle_max_range: 1.00     # 米。合理性封顶，正常速度下够不着
    obstacle_width: 1.0471975511965976   # 弧度 = ±30°，与 LiDAR 原语的"前方扇区"同宽
    obstacle_min_speed: 0.02     # 米/秒。低于此视为"没有在平移"，不做判定
                                 # （否则停在墙边会被反复锁存）

    # 新鲜度**不由被监视的答案自己声明**：sector_min_range 把"扫描陈旧"与
    # "扇区真的空"返回成同一个值（valid=false, range=-1），直接信它就会把
    # "我瞎了"读成"路是通的"（D-028 的「不知道 ≠ 安全」）。
    # 所以另取一路心跳：LiDAR 原语每收到一帧扫描发一次 /embodied/lidar/front，只看到达时刻。
    lidar_front_topic: /embodied/lidar/front
    obstacle_scan_timeout: 0.5   # 秒。心跳超时（/scan 10 Hz，0.5 s 已是 5 帧余量）
    sector_service: /lidar_driver/sector_min_range
    obstacle_reply_timeout: 0.5  # 秒。服务回答本身的超时（节点不在/卡住也算"不知道"）

    status_topic: /embodied/safety/status
    event_topic: /embodied/safety/events
