safety_runtime:
  ros__parameters:
    # 厂商离线 ASR 的文本输出。⚠️ 只**订阅**它 ——
    # 识别侧复用厂商的离线链路，执行侧完全由本项目自己做（D-024 决策 3）。
    voice_topic: /asr_node/voice_words

    # ⚠️ 独立零速通道：锁存期间本节点**自己**直接向底盘发 Twist()（全零）。
    #    为什么不用"命令 Motor Driver 停"就够了：持续发零目前只在 Motor Driver 里（D-025），
    #    **它自己挂了就没人发零了**，而底盘没有指令超时保护（D-020）会一直保持最后速度。
    #    所以急停通道必须独立。🔒 本节点唯一的发布语句是 publish(Twist()) —— 只会发零。
    zero_channel_topic: /cmd_vel
    zero_rate: 10.0

    # 安全词表（整句匹配，不是子串匹配 —— 理由见 estop.py）。
    # 默认表见 embodied_safety_runtime/estop.py 的 DEFAULT_SAFETY_PHRASES。
    # 想加现场常用说法就在这里加，例如：
    #   safety_phrases: ['停', '停下', '急停', 'stop', 'halt']

    # best-effort：把下游的锁存也打开。⚠️ **急停不依赖它们能调通**。
    motor_stop_service: /motor_driver/stop
    control_stop_service: /control_skills/stop

    # 对 Motor Driver 的**停更看门狗**：它自己挂了既不报错也没人转告，
    # 而"持续发零"目前只在它里面（D-025）—— 底盘没有指令超时保护（D-020），
    # 没人发零它会保持最后速度一直跑。所以本节点必须自己盯着，停更即自动接管发零。
    # ⚠️ 首次见到之前永不判失联（否则每次启动都先来一次假警报，把真警报淹掉）。
    watch_motor: true
    motor_status_topic: /embodied/motor/status
    motor_watchdog: 2.0          # 秒。Motor Driver 状态正常约 20 Hz，2 s 已是 40 倍余量

    status_topic: /embodied/safety/status
    event_topic: /embodied/safety/events
