# Skill 注册表 —— 网关的**数据**（不是代码）。
#
# 每个技能的：怎么调（transport/target/srv_type）、允不允许要（params 的 min/max 与
# max_norm）、谁能调（allowed_principals）、等多久（timeout_s）。
#
# ⚠️ 这里的 min/max 管的是「**允不允许要**」；底层 Control Skill 的 `max_distance`
#    管的是「**能不能做到**」。两层都要，语义不同。而且**本表必须比底层更严或相等** ——
#    比底层还宽的话，放行的请求会一路走到下层再被拒，上层策略就名存实亡了
#    （`registry.py:check_against_control_skills_limits` 会在启动时抓住这种配置错误）。
#
# ⚠️ `allowed_principals` 是 D-003「Agent 不得触达控制技能」**唯一**能真正执行的地方。
#    所以 control.* 一律**不含** `agent.planner` —— 这不是疏漏，是那条架构红线本身。
#    而 task-tier（Autonomous / Semantic）**应当**允许 `agent.planner` ——
#    那正是 D-003 说的"Agent 可以命名的那一层"。
#
# ⚠️ `causes_motion` 决定 `allow_motion` 闸门管不管它（D-033），默认 **true**（保守）：
#    漏写一个字段 = 少一道闸门，所以默认往安全一侧倒。只读查询显式写 false。

skills:

  control.move_relative:
    tier: control
    description: 机体坐标系下平移 (x, y) 米，不改变朝向。x 前 / y 左（REP-103）。
    transport: service
    target: /control_skills/move_relative
    srv_type: embodied_skills_interfaces/MoveRelative
    timeout_s: 15.0          # Control Skill 最长约 1.0 m / 0.15 m/s ≈ 6.7 s，留足余量
    cancel_target: /control_skills/stop
    causes_motion: true
    allowed_principals:
      - router.deterministic   # D-006 的本地确定性解析器
      - operator.manual        # 人工/验收工装
      # ⚠️ 刻意不含 agent.planner —— 见文件头
    params:
      - {name: x, type: float, unit: 'm', min: -0.5, max: 0.5}
      - {name: y, type: float, unit: 'm', min: -0.5, max: 0.5}
    # 单字段各在 ±0.5 内**不等于**位移在 0.5 内：(0.5, 0.5) 的模长是 0.707。
    # 这条跨字段约束才是真正的"单次位移上限"，且刻意小于底层的 max_distance = 1.0。
    max_norm:
      params: [x, y]
      max: 0.5
      note: 单次位移策略上限

  control.rotate:
    tier: control
    description: 原地旋转 angle 弧度，逆时针为正（REP-103，绕 +z）。
    transport: service
    target: /control_skills/rotate
    srv_type: embodied_skills_interfaces/Rotate
    timeout_s: 15.0          # 最长约 π / 0.40 rad/s ≈ 7.9 s
    cancel_target: /control_skills/stop
    causes_motion: true
    allowed_principals:
      - router.deterministic
      - operator.manual
    params:
      - {name: angle, type: float, unit: 'rad', min: -3.141592653589793, max: 3.141592653589793}

  control.stop:
    tier: control
    description: 立即中止当前运动（不等待）。**这是工艺流程上的中止**，不是安全兜底 ——
      安全兜底始终是 Safety Runtime 的独立零速通道（D-027）。
    transport: service
    target: /control_skills/stop
    srv_type: std_srvs/Trigger
    timeout_s: 5.0
    allowed_principals:
      - router.deterministic
      - operator.manual
    # ⚠️ 刻意是 **false**：让车**停**不需要先"允许移动"。
    #    否则一旦 allow_motion 关了，连停都发不出去 —— 那是把安全动作一起锁掉了。
    #    它本身也不会让车动（只是把速度置零）。
    causes_motion: false

  primitive.sector_min_range:
    tier: primitive
    description: 查询某扇形扇区内的最近回波距离。**只读，不产生任何运动。**
    transport: service
    target: /lidar_driver/sector_min_range
    srv_type: embodied_skills_interfaces/SectorMinRange
    timeout_s: 5.0
    causes_motion: false     # 只读查询，不碰执行器
    allowed_principals:
      # 只读查询不碰执行器，所以 Agent 允许调用 —— Permission 是**按技能**的策略，
      # 不是"一律不给 Agent"的一刀切。
      - agent.planner
      - router.deterministic
      - operator.manual
    params:
      - {name: center, type: float, unit: 'rad', min: -3.141592653589793, max: 3.141592653589793}
      - {name: width, type: float, unit: 'rad', min: 0.0, max: 6.283185307179586}
      - {name: max_range, type: float, unit: 'm', min: 0.0, max: 25.0}

  primitive.path_clear:
    tier: primitive
    description: 判断某扇形方向在给定距离内是否通畅。⚠️ `clear=true` 只表示**这个扇形、
      这个距离内**没有回波，**不**保证整条路径安全（D-028）。
    transport: service
    target: /lidar_driver/path_clear
    srv_type: embodied_skills_interfaces/PathClear
    timeout_s: 5.0
    causes_motion: false     # 只读查询，不碰执行器
    allowed_principals:
      - agent.planner
      - router.deterministic
      - operator.manual
    params:
      - {name: width, type: float, unit: 'rad', min: 0.0, max: 6.283185307179586}
      - {name: clear_range, type: float, unit: 'm', min: 0.0, max: 25.0}

  # ---------- task-tier（Autonomous Skill）----------
  # ⚠️ 与上面几类的**结构性差别**：它的终态由**技能自己报**（ARRIVED / BLOCKED / …），
  #    因为只有它知道"是走到了"还是"被挡了"。网关负责**校验那个词**合法（D-032）。
  #    它也**会唤醒 Agent**（task-tier 终态是唤醒集，D-004）—— control.* 不会。
  autonomous.advance_until_blocked:
    tier: task
    description: 朝 +x 逐步前进，直到前方受阻或走满上限。**闭环**：每一步都重新问一次 LiDAR。
    transport: service
    target: /autonomous_skills/advance_until_blocked
    srv_type: embodied_skills_interfaces/AdvanceUntilBlocked
    # 它自己是一串运动 + 查询，比单个 control 原语长得多：
    # 0.5 m / 0.15 m/s ≈ 3.3 s 的运动，加上每步的服务往返开销，留足余量。
    # ⚠️ 超时太短会把一次**正常**的行走判成超时而取消 —— 那比慢更糟。
    timeout_s: 45.0
    cancel_target: /autonomous_skills/cancel
    causes_motion: true
    allowed_principals:
      - agent.planner        # ★ task-tier **应当**允许 Agent 调用 —— 这是 D-003 的那一层
      - operator.manual
    params:
      # ⚠️ 策略上限：比单次 move_relative 的 0.5 m 更严（它是"连续走"，风险叠加）。
      - {name: max_distance, type: float, unit: 'm', min: 0.01, max: 0.5}
      # ⚠️ 这个阈值**必须按部署环境实测标定**（D-028）：同一台车两次摆位，
      #    近场回波占比在 3.6% 与 67% 之间摆动。拍一个数一定会被场地否决。
      - {name: clear_range, type: float, unit: 'm', min: 0.1, max: 1.0}
      - {name: step, type: float, unit: 'm', min: 0.02, max: 0.2}

  autonomous.turn_until_clear:
    tier: task
    description: 原地逐步转，直到前方通畅或转满上限。**闭环**：每转一步都重新问一次 LiDAR。
    transport: service
    target: /autonomous_skills/turn_until_clear
    srv_type: embodied_skills_interfaces/TurnUntilClear
    # 与 advance 同量级：最多转半圈、每步都要一次雷达往返。
    timeout_s: 45.0
    cancel_target: /autonomous_skills/cancel
    causes_motion: true
    allowed_principals:
      - agent.planner        # ★ task-tier **应当**允许 Agent 调用（D-003 的那一层）
      - operator.manual
    params:
      # ⚠️ 上限取 π：单次 `rotate` 的底层上限就是它，转超过半圈方向就没意义了。
      - {name: max_angle, type: float, unit: 'rad', min: 0.1, max: 3.141592653589793}
      - {name: clear_range, type: float, unit: 'm', min: 0.1, max: 1.0}
      - {name: step_angle, type: float, unit: 'rad', min: 0.05, max: 1.5707963267948966}
      # ⚠️ **这个字段网关校验不了**：只接受 +1 / -1，而注册表只支持 min/max 区间
      #    —— 写成 [-1, 1] 会放行 0 和 0.5。所以精确约束落在技能自己的
      #    `turn_plan.validate()` 里（有单测）。这是**已知的校验缝隙**，不是疏忽：
      #    上不了注册表的东西必须在下一层挡住，而不是"网关没管就没人管"。
      - {name: direction, type: float, unit: '', min: -1.0, max: 1.0}

  # ---- Semantic Skill 层（task-tier）--------------------------------------
  # ⚠️ 与上面两个 autonomous 技能**同层不同类**：那两个是**反应式运动**
  #    （闭环、会动），这一个**只读、不动**（`causes_motion: false`）。
  #    名字用 `semantic.` 前缀，一眼能看出"它回答的是语义问题，不是动作"。
  semantic.look_for:
    tier: task
    description: 看一眼视野里有没有 <label>，并给出它在画面里的左右位置。**只读、不动**。
    transport: service
    target: /semantic_skills/look_for
    srv_type: embodied_skills_interfaces/LookFor
    # 图像在本地话题、判定是纯计算：正常毫秒级。留 20 s 是给"视觉那边刚起来、
    # 模型还在加载"的余量 —— ⚠️ 那种情况下它会如实回 FAILED（不知道），
    # 而不是干等或编一个"没有"。
    timeout_s: 20.0
    cancel_target: ''        # 🔒 只读查询，没有可取消的东西
    # ★ 只读查询显式写 false —— 它不受 `allow_motion` 闸门约束，
    #   也不需要人看护。**默认是 true**（漏写就少一道闸门），所以这个字段必须显式写。
    causes_motion: false
    allowed_principals:
      - agent.planner        # ★ task-tier **应当**允许 Agent 调用（D-003 的那一层）
      - operator.manual
    params:
      # ⚠️ 类别名是**模型类别表里的字符串**（如 person / bottle / cup）。
      #    写错/不在表里不会静默变成"没找到" —— 技能会回 FAILED 并列出能查的名字
      #    （D-046 决策 3：认不出就说不认识，不许永远说"没有"）。
      #    网关这边只能查"非空"，"在不在表里"由下一层挡住。
      - {name: label, type: string, unit: ''}
      # ⚠️ "多少分算数"由**调用方**定：nano 模型在杂物场景常给 0.2~0.4，
      #    这是一个策略问题，不是一个可以替人拍板的常数。
      - {name: min_score, type: float, unit: '', min: 0.0, max: 1.0}

  # ⚠️ **与 `look_for` 同层同类**（只读、不动），差别只在"问的是整幅还是某一侧"。
  #    之所以单列一条而不是给 `look_for` 加个可选参数：**"哪一侧"改变了
  #    `TARGET_LOST` 的含义**（整幅没有 ↔ 那一侧没有）—— 一个名字担两种含义
  #    正是本项目一贯拒绝的。分开之后，LLM 的菜单里两条各有各的说法。
  semantic.look_on_side:
    tier: task
    # ⚠️ **词表必须写进 description**：LLM 的菜单（`llm_planner.skill_menu`）
    #    是从这里投影出来的，而`public_view()` 只带参数**名字与类型**、带不了枚举。
    #    不写的话模型很可能填'左边'/'左'，然后得到一个 FAILED ——
    #    那不是它的错，是我们没告诉它。（同理：`label` 也必须说清是模型类别表里的词。）
    description: 只看画面的**某一侧**有没有 <label>。**只读、不动**。
      `side` **必填**，只认 'left' 或 'right' 两个词（写别的、或给空串，
      都会如实回 FAILED —— **不会**当成"不限"）；画面左边 = 机体左边。
      查"整幅有没有"用 semantic.look_for（**两处的 TARGET_LOST 含义不同**）。
    transport: service
    target: /semantic_skills/look_on_side
    srv_type: embodied_skills_interfaces/LookOnSide
    timeout_s: 20.0         # 与 look_for 同量级，理由同（视觉那边可能在加载模型）
    cancel_target: ''       # 🔒 只读查询，没有可取消的东西
    causes_motion: false    # ★ 必须显式写（默认 true，漏写就少一道闸门）
    allowed_principals:
      - agent.planner        # ★ task-tier **应当**允许 Agent 调用（D-003 的那一层）
      - operator.manual
    params:
      - {name: label, type: string, unit: ''}
      # ⚠️ **这个字段网关校验不了取值**：只认 'left' / 'right'，
      #    而注册表只能查"是非空字符串" —— 写 `右边` / `Left` 都会放行。
      #    所以精确约束落在 **下一层**（`vision_query.check_side`，有单测），
      #    而且它以 **FAILED（不知道）**的形式回到上层，**不会**静默当成"不限"
      #    ——那会让"只看左边"变成"整个画面都看"，而结果看起来完全正常。
      #    与 `turn_until_clear` 的 `direction`（只认 ±1）是同一类**已知校验缝隙**：
      #    上不了注册表的东西必须在下一层挡住，而不是"网关没管就没人管"。
      # ⚠️ **空串也不等于"不限"，是"没问"**（2026-10-09 实测口径）：
      #    经本网关 ⇒ 空串被**网关自己**拒（`REJECTED: 参数 side 是空字符串`）；
      #    压根不给 ⇒ `缺少必填参数 ['side']`；**直接**调 `~/look_on_side` ⇒
      #    被 `look_plan.check_asked_side` 挡下并回 FAILED。三条路都**不会**静默当成"不限"。
      #    要整幅就调 `semantic.look_for`，那**是另一个问题**（两处 `TARGET_LOST` 含义不同）。
      - {name: side, type: string, unit: ''}
      - {name: min_score, type: float, unit: '', min: 0.0, max: 1.0}
