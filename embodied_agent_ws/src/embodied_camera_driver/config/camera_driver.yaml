camera_driver:
  ros__parameters:
    # 输入：厂商 usb_cam 出图话题
    input_topic: /depth_cam/rgb0/image_raw
    # 输出：本项目收口后的相机话题（帧号已重打、frame_id 已可解析）
    output_topic: /embodied/camera/image
    diag_topic: /embodied/camera/diag

    # TF：camera_link0 已在 URDF 中定义；camera 是本节点补上的图像帧
    parent_frame: camera_link0
    output_frame: camera
    publish_static_tf: true
    # REP-103 光学坐标系 rpy = (-pi/2, 0, -pi/2)，即 z 前 / x 右 / y 下
    # ⚠️ 首次使用务必按 launch 文件里的方法实机目视校验后再定稿
    tf_roll: -1.5707963267948966
    tf_pitch: 0.0
    tf_yaw: -1.5707963267948966

    # 时间戳策略：original | receipt | corrected
    # corrected = 收到时刻 - pipeline_latency，最接近真实曝光时刻
    stamp_source: corrected
    # 秒。2026-10-06 实测标定：在「曝光 -> 本节点 receipt」的延迟均值上扣掉
    # 一帧栅格的半周期（T/2，事件时刻相对帧栅格采样是均匀的）。
    # 标定方法：tools/camera_latency_probe.py --topic /embodied/camera/image
    #           --repeat 6 --settle 2  → 读「汇总」的「戳-下发」均值 D，则
    #           pipeline_latency = 当前值 + D − T/2（T = 该话题单帧周期）。
    #   例：2026-10-06 D=+88 ms、T=44 ms、当时 P=45 ms → 45+88−22 = 111 → 取 110 ms。
    # ⚠️ 这是**随负载变化**的量，不是物理常数：2026-10-05 同一条管线实测仅约 30 ms，
    #    2026-10-06 为约 110 ms（帧率也从 22.6 Hz 掉到 19 Hz）。换负载/重启栈后应重标。
    pipeline_latency: 0.110

    # 诊断话题发布周期（秒）
    diag_period: 5.0
